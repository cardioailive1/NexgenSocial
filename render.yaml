# Only the frontend (and optionally a Postgres database) deploy via this
# blueprint. The backend now runs on Fly.io -- see backend/FLY_DEPLOY.md --
# because live streaming needs a UDP-capable host, which Render's web
# services don't provide. An earlier version of this file also defined a
# `nexgensocial-api` Render web service; that's intentionally removed now.
# Trying to build the backend on Render will attempt to compile mediasoup's
# native worker binary, which is memory-heavy and can OOM Render's build
# environment for exactly that reason -- don't add that service back
# without moving live streaming off Fly first.

databases:
  - name: nexgensocial-db
    plan: free
    databaseName: nexgensocial
    user: nexgensocial

services:
  # --- Frontend: a Node web service serving the built React app (not a
  # static-site/CDN deployment) -- see frontend/server.js. Client-side
  # rendering either way; this just changes how the files are hosted.
  - type: web
    name: nexgensocial-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: VITE_API_URL
        sync: false # set to your Fly.io backend URL, e.g. https://nexgensocial-udp.fly.dev
